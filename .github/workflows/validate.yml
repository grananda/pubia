name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de los scripts del plugin
        run: pip install --quiet python-docx>=1.2.0 striprtf>=0.0.26

      # La version global se olvida sola. Si el plugin cambia de version y
      # VERSION no, el release saldria sin reflejar el cambio (o no saldria).
      - name: La version global acompana al plugin
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'plugins/*/.claude-plugin/plugin.json')
          [ -z "$CHANGED" ] && { echo "Ningun plugin.json tocado."; exit 0; }
          BUMPED=""
          for f in $CHANGED; do
            OLD=$(git show "$BASE:$f" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            NEW=$(python3 -c 'import json;print(json.load(open("'"$f"'"))["version"])')
            [ "$OLD" != "$NEW" ] && BUMPED="$BUMPED $f($OLD->$NEW)"
          done
          [ -z "$BUMPED" ] && { echo "Plugin tocado pero sin cambio de version."; exit 0; }
          echo "Plugin con version nueva:$BUMPED"
          if git diff --quiet "$BASE"...HEAD -- VERSION; then
            echo "::error::El plugin cambio de version pero VERSION sigue igual ($(cat VERSION)). Subela: es la que dispara el release."
            exit 1
          fi
          echo "VERSION -> $(cat VERSION). Correcto."

      # La comprobacion de arriba va en un solo sentido: plugin -> VERSION. Falta
      # la otra, contenido -> plugin, y por ahi se cuelan cambios que el usuario
      # nunca recibe: Claude Code cree que su copia instalada esta al dia.
      - name: Cada plugin tocado sube su version
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          FALLOS=""
          for p in plugins/*/; do
            NAME=$(basename "$p")
            git diff --quiet "$BASE"...HEAD -- "$p" && continue
            MAN="${p}.claude-plugin/plugin.json"
            OLD=$(git show "$BASE:$MAN" 2>/dev/null \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            [ -z "$OLD" ] && { echo "$NAME es nuevo en esta rama."; continue; }
            NEW=$(python3 -c 'import json;print(json.load(open("'"$MAN"'"))["version"])')
            if [ "$OLD" = "$NEW" ]; then
              FALLOS="$FALLOS $NAME($NEW)"
            else
              echo "$NAME $OLD -> $NEW. Correcto."
            fi
          done
          if [ -n "$FALLOS" ]; then
            echo "::error::Plugins con ficheros modificados y la misma version:$FALLOS. Subela, o los usuarios ya instalados no recibiran el cambio."
            exit 1
          fi

      - name: Manifiestos validos y rutas existentes
        run: python3 .github/scripts/check_manifests.py

      - name: Frontmatter de los skills
        run: python3 .github/scripts/check_skills.py

      # La carga de los skills es en diferido: una ruta que no resuelve no da
      # error, simplemente deja sin aplicar la regla que hubiera en ese fichero.
      - name: Las rutas de los skills resuelven
        run: python3 .github/scripts/check_rutas.py

      # Lo que de verdad se rompe aqui: un anclaje que deja de resolver, el
      # sidecar de marcas resueltas, o el guardarrail que impide marcar una
      # preferencia de estilo en rojo.
      - name: Pipeline de extremo a extremo
        run: python3 .github/scripts/check_pipeline.py

      - name: Cierre y SVG de los HTML de docs/
        run: python3 .github/scripts/check_html.py

      # Un bloque ```mermaid invalido no da error: se queda como un recuadro roto
      # en la portada del repo. Va solo aqui y no en release.yml: es una
      # comprobacion de documentacion, no una puerta de publicacion.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Los diagramas Mermaid del README dibujan
        run: |
          npm install --silent --no-fund --no-audit --no-save mermaid@11 jsdom
          node .github/scripts/check_mermaid.mjs

      - name: Sin mojibake ni invisibles en el texto
        run: python3 .github/scripts/check_mojibake.py

      - name: Scripts Python compilan
        run: |
          find plugins .github/scripts -name '*.py' -not -path '*__pycache__*' -print0 \
            | xargs -0 python3 -m py_compile && echo "Todos compilan."
